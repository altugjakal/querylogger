<!doctype html>
<html class="no-js" lang="en" xmlns="http://www.w3.org/1999/html">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boomerang Search</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="">

  <meta property="og:title" content="">
  <meta property="og:type" content="">
  <meta property="og:url" content="">
  <meta property="og:image" content="">
  <meta property="og:image:alt" content="">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#fafafa">
  <style>
    .lang-selector-container {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 15px;
    }
    .lang-select {
      padding: 6px 12px;
      font-size: 14px;
      border-radius: 4px;
      border: 1px solid #ccc;
      background-color: #fff;
      cursor: pointer;
    }
  </style>
</head>

<body>

<!-- Add your site or application content here -->

<div class="search-container">



  <h1 class="search-icon">Boomerang</h1>
  <button class="search-sub-box" style="background: red; height: 50px !important; color: yellow" onclick="switchTask()" id="currentTask"></button>
  <span id="exampleQuery"></span>

  <div class="search-box" id="search-box">
    <textarea id="search-input" class="search-input" placeholder="Search"></textarea>
  </div>

  <center>
    <input class="search-sub-box" value="Boomerang Search" onclick="search()" aria-label="Google Search" name="btnK" role="button" type="submit">
  </center>

  <span><button id="consent" onclick="consent()">I accept</button> the terms in <a href="https://docs.google.com/document/d/1IQGUx9cKubUhGPADl_6PxA3O9RZs4Kp1najl_EVNPX4/edit?usp=sharing" target="_blank">here</a></span>
  <span>Make sure you have read and signed the participation form. If not read it and press the button, or contact <a href="mailto:altugjakal@gmail.com">altugjakal@gmail.com</a> and provide a signed form.</span>

  <div id="resultsField"></div>
  <div class="lang-selector-container">
    <label for="languageField" style="margin-right: 8px; align-self: center; font-weight: bold;">Language / Dil:</label>
    <select id="languageField" class="lang-select" onchange="location.reload()">
      <option value="tr" selected>Türkçe (TR)</option>
      <option value="en">English (EN)</option>
    </select>
  </div>
</div>

<script src="js/app.js"></script>

</body>

</html>
